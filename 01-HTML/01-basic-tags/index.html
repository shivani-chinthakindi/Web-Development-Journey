<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML tags</title>
</head>
<body>
    <!--Heading tags-->
    <h1>Five</h1>
    <h2>Four</h2>
    <h3>Three</h3>
    <h4>Two</h4>
    <h5>One</h5>
    <h6>Zero</h6>

    <!--Paragraph tag-->
    <p>
        These are the basics of HTML.<br>
    </p>
    <p>
        It includes some basic tags like html, head, body and more...
    </p>
    <hr>
    <p>
        This line appears below a horizontal rule.
    </p>
</body>
</html>
