<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML lists practice</title>
</head>
<body>
    <h1>HTML lists</h1>
    <h2>Unordered list</h2>
    <ul>
        <li>Java</li>
        <li>DSA</li>
        <li>Web Development</li>
        <li>Git & Github</li>
    </ul>
    <h2>Ordered list</h2>
    <ol>
        <li>Wake up</li>
        <li>Excercise</li>
        <li>Learn & Build</li>
        <li>Repeat</li>
    </ol>
    <h2>Descriptive list</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Used to structure web pages.</dd>
        <dt>CSS</dt>
        <dd>Used to style web pages.</dd>
        <dt>JavaScript</dt>
        <dd>Used to add interactivity.</dd>
    </dl>
</body>
</html>
