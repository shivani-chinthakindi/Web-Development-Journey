<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images practice</title>
</head>
<body>
    <h1>Links and Images</h1>
    <h2>External link</h2>
    <a href="https://www.google.com" target="_blank">
        Open Google
    </a>
    <br><br>
    <h2>Email link</h2>
    <a href="mailto:example@email.com">
        Send an email
    </a>
    <br><br>
    <h2>Mobile link</h2>
    <a href="tel:+911234567890">
        Call us
    </a>
    <br><br>
    <hr>
    <h2>Image</h2>
    <img src="images/India-Flag.jpg" alt="Flag" width="250">
</body>
</html>
