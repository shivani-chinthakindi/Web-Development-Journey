<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table>
  <caption>Quarterly Sales and Inventory Summary</caption>
  <thead>
    <tr>
      <th rowspan="2">Category</th>
      <th rowspan="2">Product</th>
      <th colspan="2">Q1 Sales</th>
      <th rowspan="2">Status</th>
    </tr>
    <tr>
      <th>Units</th>
      <th>Revenue</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">Electronics</td>
      <td>Smartphones</td>
      <td>500</td>
      <td>$250,000</td>
      <td>In Stock</td>
    </tr>
    <tr>
      <td>Laptops</td>
      <td>120</td>
      <td>$180,000</td>
      <td>Low Stock</td>
    </tr>
    <tr>
      <td>Apparel</td>
      <td>Jackets</td>
      <td>350</td>
      <td>$70,000</td>
      <td>In Stock</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th colspan="2">Total</th>
      <td>970</td>
      <td>$500,000</td>
      <td>N/A</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
