<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <form action="">
        <h1>Payment Form</h1>
        <h2>Contact Information</h2>
        <p>Required fields are followed by *</p>
        <p>Name: *<input type="text" name="name" required></p>
        <fieldset>
            <legend>Gender:</legend>
            <p>
                Male<input type="radio" name="name" id="Male">
                Female<input type="radio" name="name" id="Female">
            </p>
        </fieldset>
        <p>Address: *<textarea name="address" id="address" cols="200" rows="5" required></textarea></p>
        <p>Email: *<input type="email" name="email" id="email" required></p>
        <p>Pincode:*<input type="number" name="pincode" id="pincode" required></p>
        <h2>Payment Information</h2>
        <p>
            Card Type:
            <select name="card-type" id="card-type">
            <option value="">--Select a Card type--</option>
            <option value="visa">Visa</option>
            <option value="rupay">Rupay</option>
            <option value="mastercard">MasterCard</option>
            </select>
        </p>
        <p>Card Number:<input type="number" name="card_number" id="card_number"></p>
        <p>* Expiration Date:<input type="date" name="exp_date" id="exp_date" required></p>
        <p>CVV:<input type="password" name="cvv" id="cvv"></p>
        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
