<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Semantic HTML Example</title>
    </head>
    <body>
        <header>
            <h1>My Personal Blog</h1>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
            </nav>
        </header>

        <main>
            <article>
                <h2>Learning semantic HTML</h2>
                <p>Semantic tags make code <strong>easier to read</strong> and improve SEO,</p>
            </article>

            <aside>
                <h3>Quick Tip</h3>
                <p>Never use &lt;div&gt; if a semantic tag fits!</p>
            </aside>
        </main>

        <footer>
            <p>&copy; 2026 My Blog</p>
        </footer>
    </body>
</html>
